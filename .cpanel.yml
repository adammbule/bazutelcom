---
deployment:
  tasks:
    # Replace this with your actual cPanel account document root.
    # Example: /home/yourcpaneluser/public_html/ or /home/yourcpaneluser/public_html/yourdomain/
    - export DEPLOYPATH=/home/yourcpaneluser/public_html/
    # Build the Flutter web app locally before deploying:
    # flutter build web --release
    - if [ -d build/web ]; then /bin/cp -R build/web/. "$DEPLOYPATH"; else echo "Missing build/web output. Run flutter build web --release first."; exit 1; fi